<!DOCTYPE html>
<html lang="en">
<head>
  <!-- ============================================================
    META & PAGE SETUP
  -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive To-Do List</title>
  
  <!-- Link to external CSS file -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- ============================================================
    BODY
  -->
  <!-- Main container for the entire application -->
  <div class="container">
    
    <!-- Application title -->
    <h1>My To-Do List</h1>
    
    <!-- Task counter display -->
    <!-- Shows the current number of tasks added to the list -->
    <div class="task-count" id="task-count">0 tasks</div>
    
    <!-- Input section for adding new tasks -->
    <div class="input-group">
      <!-- Text input field where users type their tasks -->
      <input 
        type="text" 
        id="new-task" 
        placeholder="Add a new task..."
        autocomplete="off"
      >
      <!-- Button to add the task to the list -->
      <button id="add-task">Add</button>
    </div>
    
    <!-- Container for the task list -->
    <!-- Tasks will be dynamically added here as <li> elements -->
    <ul id="task-list">
      <!-- Empty state message shown when no tasks exist -->
      <div class="empty-state">No tasks yet. Add one to get started!</div>
    </ul>
  </div>

  <!-- ============================================================
       JAVASCRIPT LINK
  -->
  <script src="script.js"></script>

  <!-- ============================================
       FOOTER
  -->
  <footer>
    <p>&copy; 2026 To-Do List | Míriam Domínguez Martínez | DBE Academy </p>
  </footer>
</body>
</html>
